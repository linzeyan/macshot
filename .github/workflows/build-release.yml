name: Build Release

# What a tag produces on this branch: the Windows app, both architectures and both
# variants, zipped and attached to a GitHub Release, plus a signed MSIX installer for each
# when a signing certificate is configured.
#
# This replaced the Mac app's release pipeline, which is still on main and is where Mac
# releases are cut from. The two cannot share a tag trigger — a tag pushed here would
# otherwise start a macOS build of a tree whose changes are all under windows/.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, which must already exist on the remote.
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      # One failing architecture should not cancel the other: knowing that arm64 builds
      # and x64 does not is most of the diagnosis.
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        variant: [normal, offline]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # AVIF is written by windows/native/macshot-avif, a Rust cdylib the project builds
      # during publish, so a Rust toolchain is as much a build dependency here as the .NET
      # SDK is. Installed explicitly rather than relying on the runner image having one:
      # the image does ship Rust today, and a leg that silently stopped producing AVIF
      # because that changed would pass every check in this file.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      # The tag says what the build calls itself. Everything downstream reads this: the
      # file names, the release title, and — through -p:Version — the About page and the
      # update check, which compares the running version against the published tags and
      # would offer an update to everybody while the assembly still said 0.0.0.
      - name: Read the version out of the tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $version = $tag -replace '^v', ''
          # AssemblyVersion takes four numbers and no suffix, so the pre-release part is
          # dropped from it and kept only in the name the user sees. The run number goes
          # in the fourth position, which is what the About page shows as the build.
          $numeric = ($version -split '-')[0]
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly=$numeric.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          $variant = if ("${{ matrix.variant }}" -eq "offline") { "Offline" } else { "" }
          dotnet publish windows/src/Macshot.Windows/Macshot.Windows.csproj `
            --configuration Release `
            --runtime win-${{ matrix.arch }} `
            --self-contained true `
            -p:Variant=$variant `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly }} `
            -p:FileVersion=${{ steps.version.outputs.assembly }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            --output publish
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

      # The variant, asserted rather than trusted — the same check the CI build makes and
      # for a sharper reason: a control that collapsed at run time would leave the endpoint
      # in a binary about to be published as the build without it.
      - name: The offline build must contain no translation endpoint
        if: matrix.variant == 'offline'
        shell: pwsh
        run: |
          $assembly = Get-ChildItem -Recurse -Filter Macshot.Windows.Offline.dll publish |
            Select-Object -First 1
          if (-not $assembly) { throw "The offline assembly was not produced." }
          $bytes = [System.IO.File]::ReadAllBytes($assembly.FullName)
          $text = [System.Text.Encoding]::Unicode.GetString($bytes) +
                  [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match 'translation\.googleapis\.com') {
            throw "The offline build contains the translation endpoint."
          }

      # The name is not decoration: the update check reads it. ReleaseCheck.IsWindowsAsset
      # wants "win" in it and takes "offline" as the mark of the variant, so an offline
      # build is only ever offered to an offline user and an ordinary one to an ordinary
      # user. Changing this scheme without changing that method breaks the update check
      # for everybody already running the app.
      - name: Package
        id: package
        shell: pwsh
        run: |
          $offline = if ("${{ matrix.variant }}" -eq "offline") { "-Offline" } else { "" }
          $name = "macshot$offline-${{ steps.version.outputs.version }}-win-${{ matrix.arch }}.zip"
          Compress-Archive -Path publish/* -DestinationPath $name -CompressionLevel Optimal
          "name=$name" >> $env:GITHUB_OUTPUT

      # Uploaded before the installer is attempted, and separately from it. The zip is the
      # product and the MSIX is an addition, so a missing SDK tool or a timestamp server
      # having a bad day must not be able to cost a release the binaries that were already
      # built and sitting on disk two steps earlier.
      - uses: actions/upload-artifact@v4
        with:
          name: macshot-zip-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

      # An MSIX must be signed to be installable at all, so the certificate decides where
      # this lands rather than whether it runs: a signed package goes on the release, an
      # unsigned one stays a workflow artifact. Packing on every release either way is
      # deliberate — a packaging step that only ran once a certificate existed would be a
      # step nobody had ever seen work.
      #
      # The secrets are WINDOWS_SIGNING_CERT_BASE64 (a base64 .pfx) and
      # WINDOWS_SIGNING_CERT_PASSWORD. Neither is set today.
      #
      # It packs the directory the zip was made from. There was a second, packaged publish
      # here on the reasoning that WindowsPackageType=None wires in a bootstrapper a
      # package would refuse to run; the VM says otherwise on both halves. That publish
      # fails outright — "no AppxManifest is specified" — because a single-project MSIX
      # build wants the manifest as a project item, which this one does not have. And a
      # package made from the ordinary publish installs and launches: measured, from
      # C:\Program Files\WindowsApps, with a test certificate.
      #
      # continue-on-error for the reason the zip is uploaded first: the step still shows
      # as failed, which is the loud part, but it cannot skip the release job and take the
      # zips with it.
      - name: Pack the MSIX
        id: msix
        continue-on-error: true
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          # The same name as the zip beside it, because ReleaseCheck.IsWindowsAsset reads
          # both the same way: "win" marks it as this product's build and "offline" as the
          # variant's. See the Package step above.
          $offline = if ("${{ matrix.variant }}" -eq "offline") { "-Offline" } else { "" }
          $name = "macshot$offline-${{ steps.version.outputs.version }}-win-${{ matrix.arch }}.msix"
          # At the root of the workspace rather than in a folder of its own, because
          # upload-artifact roots an artifact at the common ancestor of what it matched:
          # a package one directory down would arrive as artifacts/msix-signed/*.msix and
          # the release job's glob would not see it.
          & ./windows/tools/pack-msix.ps1 `
            -PublishDirectory publish `
            -PackageVersion ${{ steps.version.outputs.assembly }} `
            -Architecture ${{ matrix.arch }} `
            -Variant ${{ matrix.variant }} `
            -FileName $name `
            -SignedDirectory . `
            -CertificateBase64 $env:SIGNING_CERT `
            -CertificatePassword $env:SIGNING_PASSWORD
          if (-not $env:SIGNING_CERT) {
            "::warning::$name was built but NOT signed: WINDOWS_SIGNING_CERT_BASE64 is not set. Windows cannot install an unsigned MSIX, so it is not attached to the release."
            "signed=false" >> $env:GITHUB_OUTPUT
          }
          else {
            "signed=true" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/upload-artifact@v4
        if: steps.msix.outputs.signed == 'true'
        with:
          name: macshot-msix-${{ matrix.variant }}-${{ matrix.arch }}
          path: "*.msix"
          if-no-files-found: error

      # Under a name the release job does not collect, which is what keeps an
      # uninstallable file off the release page while still leaving it somewhere it can be
      # downloaded and signed by hand.
      - uses: actions/upload-artifact@v4
        if: steps.msix.outputs.signed == 'false'
        with:
          name: unsigned-msix-${{ matrix.variant }}-${{ matrix.arch }}
          path: msix-unsigned/*.msix
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # By pattern, not everything: the unsigned MSIX artifacts are deliberately named
      # outside it so that a run with no signing certificate cannot attach a file Windows
      # will refuse to install.
      - uses: actions/download-artifact@v4
        with:
          pattern: macshot-*
          path: artifacts
          merge-multiple: true

      # CHANGELOG.md is the release notes, as it is for the Mac app. A version with no
      # entry gets the tag and nothing else rather than a body that looks half-written.
      - name: Collect the release notes
        id: notes
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          version="${tag#v}"

          {
            echo 'body<<CHANGELOG_EOF'
            awk -v want="## [$version]" '
              index($0, want) == 1 { collecting = 1; next }
              collecting && /^## \[/ { exit }
              collecting { print }
            ' CHANGELOG.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The list is built here rather than given as globs, because a glob that matches
      # nothing fails the upload and the MSIX legitimately may not be there. The zips are
      # still mandatory — the bare `ls` is what fails the release when a matrix leg
      # produced nothing — and the installer is added only when one was signed.
      - name: Decide what goes on the release
        id: files
        shell: bash
        run: |
          ls artifacts/*.zip
          {
            echo 'list<<FILES_EOF'
            ls artifacts/*.zip
            ls artifacts/*.msix 2>/dev/null || true
            echo FILES_EOF
          } >> "$GITHUB_OUTPUT"

          if ! ls artifacts/*.msix >/dev/null 2>&1; then
            echo "::warning::This release carries no installer. WINDOWS_SIGNING_CERT_BASE64 is not set, so the MSIX was built unsigned and left as a workflow artifact — an unsigned MSIX cannot be installed."
            echo 'No MSIX installer: this release was built without a signing certificate. Download a zip and run the executable in it.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ contains(steps.notes.outputs.tag, '-beta.') }}
          files: ${{ steps.files.outputs.list }}
          fail_on_unmatched_files: true
